version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nagpur_postgres
    restart: always
    environment:
      POSTGRES_DB: nagpur_pulse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: nagpur_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: nagpur_ml_service
    restart: always
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - CORS_ORIGINS=http://localhost:3000,http://backend:8000
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/ml/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nagpur_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:nagpur_password@postgres:5432/nagpur_pulse
      - ML_SERVICE_URL=http://ml-service:8001
      - ML_SERVICE_TIMEOUT=10
      - FRONTEND_URL=http://localhost:3000
      - RISK_REFRESH_INTERVAL=30
      - RISK_STALE_AFTER_MINUTES=10
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: nagpur_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata:
